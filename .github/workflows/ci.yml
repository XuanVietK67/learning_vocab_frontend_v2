name: CI

# Quality gates + gated production deploy.
#  - `verify` runs on every push to master and every PR targeting it.
#  - `deploy` runs ONLY after `verify` passes on a push to master (i.e. once a
#    PR is merged). PRs never deploy to production — they only get a Vercel
#    preview URL (from Vercel's Git integration), and production on master is
#    disabled in vercel.json so this job is the single source of prod deploys.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to the same branch cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # No `cache: npm` — that requires a committed lockfile, and
          # package-lock.json is intentionally gitignored (see below).

      - name: Install dependencies
        # Use `npm install`, not `npm ci`. The lockfile is authored on Windows,
        # so it carries the win32 native binaries (@tailwindcss/oxide-win32-*,
        # lightningcss-win32-*, sharp-win32) but not the Linux ones this runner
        # needs (@tailwindcss/oxide-linux-x64-gnu, lightningcss-linux-x64-gnu,
        # which pull picomatch@4 via tinyglobby). Strict `npm ci` rejects that
        # mismatch on Linux; `npm install` reconciles the platform deps — the
        # same way Vercel installs on its Linux build.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # The build only needs these to compile; real values live in the
          # Vercel project settings. API_BASE_URL has a localhost fallback in
          # src/lib/env.ts, so this is just here to make the build deterministic.
          API_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3001

  deploy:
    name: Deploy to Vercel (production)
    needs: verify
    # `verify` already gates this. The push-only guard means PRs never reach
    # here; since on.push.branches is [master], a push event is always master.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # environment:
    #   name: production
    #   url: ${{ steps.deploy.outputs.url }}
    env:
      # Identify the Vercel project without interactive `vercel link`.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings & production env
        # Brings down API_BASE_URL, NEXT_PUBLIC_* etc. configured in the Vercel
        # dashboard so the build below matches a real Vercel production build.
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel, production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
