name: CI

# Quality gates + gated production deploy for the WEB app (apps/web).
#  - `verify` runs on every push to master and every PR targeting it: it
#    type-checks the whole workspace and lints/builds the web app.
#  - `deploy` runs ONLY after `verify` passes on a push to master (i.e. once a
#    PR is merged). PRs never deploy to production — they only get a Vercel
#    preview URL (from Vercel's Git integration), and production on master is
#    disabled in apps/web/vercel.json so this job is the single source of prod
#    deploys.
#
# Monorepo note: the web app now lives at apps/web. In the Vercel project
# (learning_vocabulary) set Root Directory = apps/web and enable "Include files
# outside the Root Directory in the Build Step" so packages/shared is available.
# Mobile (apps/mobile) is built separately via .github/workflows/mobile-eas.yml.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to the same branch cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check & build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (all workspaces)
        run: pnpm turbo run type-check

      - name: Lint (web)
        run: pnpm turbo run lint --filter=web

      - name: Build (web)
        run: pnpm turbo run build --filter=web
        env:
          # The build only needs these to compile; real values live in the
          # Vercel project settings. API_BASE_URL has a localhost fallback in
          # apps/web/src/lib/env.ts, so this is just here to make the build
          # deterministic.
          API_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3001

  deploy:
    name: Deploy to Vercel (production)
    needs: verify
    # `verify` already gates this. The push-only guard means PRs never reach
    # here; since on.push.branches is [master], a push event is always master.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Identify the Vercel project without interactive `vercel link`.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings & production env
        # Brings down API_BASE_URL, NEXT_PUBLIC_* etc. configured in the Vercel
        # dashboard so the build below matches a real Vercel production build.
        # Root Directory (apps/web) is part of these pulled settings.
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel, production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
